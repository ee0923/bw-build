name: Clean workflow history

on:
  push:
    paths: ['.github/workflows/cleanup.yml']
  workflow_run:
    workflows: [Build Bitwarden]
    types: [completed]

permissions: {}

concurrency:
  group: cleanup-workflow-history
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove completed workflow records
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Keep completed runs for 20 minutes
        run: sleep 1200
      - name: Remove completed runs and their logs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Snapshot the full list before deleting, so pagination cannot skip old records.
          gh api --paginate "repos/$GH_REPO/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | select((.updated_at | fromdateiso8601) <= (now - 1200)) | .id' \
            > "$RUNNER_TEMP/completed-runs.txt"
          while IFS= read -r run_id; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || exit 2
            [[ "$run_id" != "$GITHUB_RUN_ID" ]] || continue
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$run_id"
          done < "$RUNNER_TEMP/completed-runs.txt"
